<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; padding:0; font-family:'Outfit','Inter',sans-serif; overflow:hidden; }
  #map-wrapper { position:relative; display:inline-block; user-select:none; width:100%; max-width:900px; }
  #map-img { width:100%; height:auto; display:block; border-radius:12px; }
  
  .hotspot {
    position:absolute;
    transform:translate(-50%, -50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:10;
  }
  .marker {
    width:24px; height:24px; border-radius:50%;
    border:2.5px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:bold; color:white;
    cursor:pointer; transition:all 0.2s;
  }
  .hotspot:hover .marker { transform:scale(1.2); box-shadow:0 5px 12px rgba(0,0,0,0.6); }
  
  .c-gray { background-color: #9e9e9e; }
  .c-orange { background-color: #ff9800; }
  .c-yellow { background-color: #ffb300; }
  .c-green { background-color: #4caf50; }
  .c-red { background-color: #ef5350; }
  .c-blue { background-color: #2196f3; }
  .c-half { background: linear-gradient(90deg, #4caf50 50%, #ef5350 50%) !important; }
  
  .tooltip {
    position: absolute;
    background: rgba(15, 23, 42, 0.96);
    color: white;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.18);
    z-index: 1000;
    min-width: 160px;
    max-width: 480px;
    width: max-content;
    backdrop-filter: blur(8px);
    text-align: left;
    overflow: visible;
  }
  
  .drag-bar {
    margin-top: 15px; padding: 15px; border-radius: 10px;
    background: #e3f2fd; border: 2px dashed #1976d2;
    text-align: center; color: #0d47a1; font-weight: 600;
  }
  .drag-bar button {
    margin-left: 15px; padding: 6px 12px; background: #1976d2;
    color: white; border: none; border-radius: 6px; cursor: pointer;
    font-weight: bold; font-family: inherit;
  }
  .drag-bar button:hover { background: #115293; }
</style>
</head>
<body>
  <div id="occupancy-bar-container" style="margin-bottom: 12px; font-family: inherit; display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #e0e0e0; margin-bottom: 5px;">
      <span>🏕️ Tábor Telítettség (Belső szállások)</span>
      <span id="occupancy-text">0 / 0 fő (0%)</span>
    </div>
    <div style="width: 100%; height: 8px; background-color: #3b3f54; border-radius: 4px; overflow: hidden;">
      <div id="occupancy-fill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #4caf50 0%, #ff9800 50%, #ef5350 100%); transition: width 0.5s ease-in-out; border-radius: 4px;"></div>
    </div>
  </div>
  <div id="map-wrapper">
    <img id="map-img" src="" draggable="false" />
    <div id="hotspots-container"></div>
  </div>
  <div id="drag-bar-container"></div>

  <script>
    // Streamlit Component API
    function sendMessageToStreamlitClient(type, data) {
        var outData = Object.assign({
            isStreamlit: true,
            isStreamlitMessage: true,
            type: type,
        }, data);
        window.parent.postMessage(outData, "*");
    }

    const Streamlit = {
        setComponentValue: function(value) {
            sendMessageToStreamlitClient("streamlit:setComponentValue", {value: value});
        },
        setFrameHeight: function(height) {
            sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height});
        }
    };

    let BUILDING_GROUPS = {};
    let EDIT_MODE = false;
    let lastHeight = 0;

    function updateHeight() {
        // Measure content height precisely
        const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        // Only notify Streamlit if height changed by more than 5px to prevent infinite loop jitter
        if (Math.abs(height - lastHeight) > 5) {
            lastHeight = height;
            Streamlit.setFrameHeight(height);
        }
    }

    function renderMap(args) {
        try {
            if (!args || !args.status) {
                document.getElementById('drag-bar-container').innerHTML = "No status data received.";
                return;
            }

            const newSrc = "data:image/jpeg;base64," + args.img_b64;
            const img = document.getElementById('map-img');
            if (img.src !== newSrc) {
                img.src = newSrc;
            }
            
            EDIT_MODE = args.edit_mode;
            BUILDING_GROUPS = {};
            
            let totalCapacity = 0;
            let totalOccupancy = 0;

            let hotspotsHtml = "";
            for (let bid in args.status) {
                let s = args.status[bid];
                let sx = s.x || 0;
                let sy = s.y || 0;
                let slabel = s.label || bid;
                BUILDING_GROUPS[bid] = {x: sx, y: sy, name: s.name};
                let cursorStyle = EDIT_MODE ? 'cursor:grab;' : 'cursor:pointer;';
                
                if (bid !== 'K') {
                    totalCapacity += s.capacity || 0;
                    totalOccupancy += s.occupancy || 0;
                }
                
                let guestListHtml = "";
                if (s.guests && s.guests.length > 0) {
                    let roomColors = ['#4fc3f7', '#81c784', '#ffb74d', '#f06292', '#ba68c8', '#ffd54f', '#4dd0e1', '#a1887f'];
                    
                    // Group guests by room
                    let roomsMap = {};
                    s.guests.forEach(g => {
                        let rName = g.room || s.name;
                        if (!roomsMap[rName]) {
                            roomsMap[rName] = [];
                        }
                        roomsMap[rName].push(g);
                    });

                    let roomNames = Object.keys(roomsMap);
                    let numRooms = roomNames.length;

                    // Build side-by-side room columns
                    let columnsHtml = "";
                    roomNames.forEach((rName, idx) => {
                        let roomColor = roomColors[idx % roomColors.length];
                        let guestsInRoom = roomsMap[rName];
                        
                        let guestItemsHtml = "";
                        guestsInRoom.forEach(g => {
                            let statusTag = g.status === 'Függőben' ? ` <span style="color:#ffcc80; font-size:0.82em; margin-left:3px;">(Függőben)</span>` : "";
                            guestItemsHtml += `<div style="font-size:11px; line-height:1.35; white-space:nowrap; display:flex; align-items:center;"><span style="color:${roomColor}; font-size:12px; margin-right:4px;">👤</span><strong style="color:#ffffff;">${g.name}</strong>${statusTag}</div>`;
                        });

                        let roomHeader = (numRooms > 1 || rName !== s.name)
                            ? `<div style="font-size:11px; font-weight:700; color:${roomColor}; border-bottom:1px solid ${roomColor}44; padding-bottom:3px; margin-bottom:4px; white-space:nowrap;">🚪 ${rName}</div>`
                            : "";

                        let borderStyle = (idx > 0) ? `border-left: 1px solid rgba(255,255,255,0.18); padding-left: 10px;` : ``;

                        columnsHtml += `
                            <div style="display:flex; flex-direction:column; gap:4px; ${borderStyle}">
                                ${roomHeader}
                                ${guestItemsHtml}
                            </div>
                        `;
                    });

                    guestListHtml = `
                        <div style="margin-top:6px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.2); display:flex; flex-direction:row; gap:10px; align-items:flex-start;">
                            ${columnsHtml}
                        </div>
                    `;
                } else if (bid !== 'K') {
                    guestListHtml = `<div style="margin-top:4px; font-size:11px; opacity:0.75; font-style:italic;">(Még nincs regisztrált lakó)</div>`;
                }

                // Adaptive positioning based on marker coordinates (sx, sy)
                let isTopEdge = sy < 30;
                let isLeftEdge = sx < 25;
                let isRightEdge = sx > 75;

                let inlinePos = "";
                let baseTransform = "";
                let hoverTransform = "";

                if (isTopEdge) {
                    inlinePos += "top: 32px; bottom: auto; ";
                } else {
                    inlinePos += "bottom: 32px; top: auto; ";
                }

                if (isLeftEdge) {
                    inlinePos += "left: 0; right: auto; ";
                    baseTransform = isTopEdge ? "translateY(-6px)" : "translateY(6px)";
                    hoverTransform = "translateY(0)";
                } else if (isRightEdge) {
                    inlinePos += "right: 0; left: auto; ";
                    baseTransform = isTopEdge ? "translateY(-6px)" : "translateY(6px)";
                    hoverTransform = "translateY(0)";
                } else {
                    inlinePos += "left: 50%; right: auto; ";
                    baseTransform = isTopEdge ? "translateX(-50%) translateY(-6px)" : "translateX(-50%) translateY(6px)";
                    hoverTransform = "translateX(-50%) translateY(0)";
                }

                inlinePos += "transform: " + baseTransform + ";";

                let tooltipContent = `
                    <div style="font-weight:700; font-size:13px; color:#ffffff; white-space:nowrap;">${s.name}</div>
                    <div style="font-size:11px; opacity:0.9; margin-top:1px; color:#64b5f6; white-space:nowrap;">📊 ${bid === 'K' ? s.occupancy + ' regisztrált' : s.occupancy + ' / ' + s.capacity + ' fő'}</div>
                    ${guestListHtml}
                `;
                
                hotspotsHtml += `<div class="hotspot" data-id="${bid}" style="left:${sx}%; top:${sy}%;" id="hs-${bid}">
                  <div class="tooltip" style="${inlinePos}" data-base-transform="${baseTransform}" data-hover-transform="${hoverTransform}">${tooltipContent}</div>
                  <div class="marker c-${s.color}" style="${cursorStyle}">${slabel}</div>
                </div>`;
            }
            document.getElementById('hotspots-container').innerHTML = hotspotsHtml;

            // Update occupancy bar
            const barContainer = document.getElementById('occupancy-bar-container');
            if (totalCapacity > 0 && !EDIT_MODE) {
                barContainer.style.display = 'block';
                const pct = Math.round((totalOccupancy / totalCapacity) * 100);
                document.getElementById('occupancy-text').innerText = `${totalOccupancy} / ${totalCapacity} fő (${pct}%)`;
                document.getElementById('occupancy-fill').style.width = `${Math.min(100, pct)}%`;
            } else {
                barContainer.style.display = 'none';
            }

            if (EDIT_MODE) {
                document.getElementById('drag-bar-container').innerHTML = 
                  `<div class="drag-bar">
                    <span>✋ Húzd a jelölőket a megfelelő helyre, majd mentsd el!</span>
                    <button onclick="savePositions()">💾 Pozíciók Mentése</button>
                   </div>`;
            } else {
                document.getElementById('drag-bar-container').innerHTML = "";
            }

            setupInteractions();
            // Trigger height check after rendering new content
            setTimeout(updateHeight, 50);
        } catch (e) {
            document.getElementById('drag-bar-container').innerHTML = "Error rendering map: " + e.message;
        }
    }

    function savePositions() {
        Streamlit.setComponentValue({action: "save_positions", positions: BUILDING_GROUPS, ts: Date.now()});
    }

    function setupInteractions() {
        document.querySelectorAll('.hotspot').forEach(function(h) {
            let tt = h.querySelector('.tooltip');
            if (tt) {
                let hoverTf = tt.getAttribute('data-hover-transform');
                let baseTf = tt.getAttribute('data-base-transform');
                h.addEventListener('mouseenter', function() {
                    tt.style.opacity = '1';
                    tt.style.transform = hoverTf;
                });
                h.addEventListener('mouseleave', function() {
                    tt.style.opacity = '0';
                    tt.style.transform = baseTf;
                });
            }

            if (EDIT_MODE) {
                var dragging = false, startX, startY, origLeft, origTop, mapRect;
                function onDown(cx, cy) {
                    dragging = true;
                    mapRect = document.getElementById('map-wrapper').getBoundingClientRect();
                    startX = cx; startY = cy;
                    origLeft = parseFloat(h.style.left);
                    origTop = parseFloat(h.style.top);
                    h.querySelector('.marker').style.transform = 'scale(1.4)';
                }
                function onMove(cx, cy) {
                    if (!dragging) return;
                    var dx = ((cx - startX) / mapRect.width) * 100;
                    var dy = ((cy - startY) / mapRect.height) * 100;
                    h.style.left = Math.max(2, Math.min(98, origLeft + dx)).toFixed(2) + '%';
                    h.style.top = Math.max(2, Math.min(98, origTop + dy)).toFixed(2) + '%';
                }
                function onUp() {
                    if (dragging) {
                        var bid = h.getAttribute('data-id');
                        BUILDING_GROUPS[bid].x = parseFloat(h.style.left);
                        BUILDING_GROUPS[bid].y = parseFloat(h.style.top);
                    }
                    dragging = false;
                    h.querySelector('.marker').style.transform = '';
                }
                h.addEventListener('mousedown', function(e) { onDown(e.clientX, e.clientY); e.preventDefault(); e.stopPropagation(); });
                document.addEventListener('mousemove', function(e) { if(dragging) { onMove(e.clientX, e.clientY); e.preventDefault(); } });
                document.addEventListener('mouseup', onUp);
                
                h.addEventListener('touchstart', function(e) { onDown(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
                h.addEventListener('touchmove', function(e) { onMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
                h.addEventListener('touchend', onUp);
            } else {
                h.addEventListener('click', function() {
                    var bid = h.getAttribute('data-id');
                    Streamlit.setComponentValue({action: "click", bid: bid, ts: Date.now()});
                });
            }
        });
    }

    // Set up listeners for load and resize to dynamically but stably update height
    document.getElementById('map-img').addEventListener('load', updateHeight);
    window.addEventListener('resize', updateHeight);

    // Observe changes inside body (like adding drag bar)
    if (window.ResizeObserver) {
        const ro = new ResizeObserver(entries => {
            updateHeight();
        });
        ro.observe(document.body);
    }

    window.addEventListener("message", function(event) {
        if (event.data.type === "streamlit:render") {
            renderMap(event.data.args);
        }
    });

    sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
  </script>
</body>
</html>
